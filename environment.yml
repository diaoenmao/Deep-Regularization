  - torchvision>=0.15.0
  - cudatoolkit=11.8
  - numpy>=1.21.0
  - scipy>=1.9.0
  - scikit-learn>=1.0.0
  - matplotlib>=3.4.0
  - seaborn>=0.12.0
  - pillow>=8.0.0
  - tqdm>=4.65.0
  - pandas>=1.5.0
  - h5py>=3.8.0
  - pip
